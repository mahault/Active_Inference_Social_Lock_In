experiment:
  name: E10_structural_endogenous_gamma
  description: >
    Structural extension: per-agent dependency network with T = (I-A)^-1
    propagation of conviction U = T·u from subsidiary commitments to
    paradigm roots, plus endogenous gamma silencing of disconfirming
    evidence (evidence weight = exp(-gamma_strength * conviction_asymmetry)).

    Tests the IWAI paper's specific mechanism on the hierarchical-context
    substrate: at high gamma_strength, agents with strong propagated
    conviction in a paradigm should silence the world likelihood and
    fail to adapt when the true paradigm shifts at t=100.

    30% of agents have utility on dependents of the WRONG paradigm
    (anti-truth bloc); 70% have utility on dependents of the truth.
    Sweep (q_reliability x gamma_strength) at fixed lambda_tilt and
    paradigm-inertia parameters.

model_type: structural

base:
  pomdp:
    n_paradigms: 2
    theta_vals: [0.0, 1.0]
    true_paradigm: 1
    x_grid: [0.1, 0.3, 0.5, 0.8, 1.0]
    n_o: 5
    q_reliability: 0.70
    world:
      schedule: step
      theta_star_pre: 0.0
      theta_star_post: 1.0
      schedule_t_shift: 100
  n_context: 5
  eps_crisis: 0.15
  eps_resolve: 0.20
  eps_theta: 0.02
  D_c_normal: 0.8
  alpha_tl: 1.0
  obs_x_index: 4
  n_agents: 30
  n_steps: 250
  use_theta_schedule: true
  graph_kind: watts_strogatz
  mean_degree: 4
  social_mask: 1.0
  trust_learning: false
  resource_coupling: false
  motivated: true
  lambda_tilt: 0.5
  # structural-specific
  n_dependents: 3
  edge_precision: 0.7
  # utility tilt
  maverick_fraction: 0.20
  maverick_social_mask: 0.2
  utility_tilt_fraction: 0.30
  utility_pro: 1.0
  utility_anti: 1.0

sweep:
  q_reliability: [0.55, 0.65, 0.75, 0.85]
  gamma_strength: [0.0, 0.5, 1.0, 2.0, 4.0]

seeds: [0, 1, 2, 3, 4]

outputs:
  dir: experiments/results/E10
