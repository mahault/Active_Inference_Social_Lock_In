experiment:
  name: E11_tri_channel_ablation
  description: >
    Tri-channel ablation: structural (gamma) x social (trust learning)
    x material (resource coupling). 2x2x2 = 8 conditions on a slow truth
    drift scenario. Isolates the marginal contribution of each of the
    three channels Mahault contributes beyond the IWAI paper's baseline
    paradigm-belief mechanism.

    Conviction asymmetry from a 30 percent anti-truth bloc (utility_anti=1).
    Under no channel, evidence eventually wins. Each channel locks the
    anti-truth bloc in via a distinct mechanism:
      gamma > 0       : evidence attenuation at the precision level (IWAI)
      trust learning  : social isolation of out-group neighbors
      resource on     : material gating of informative experiments

model_type: structural

base:
  pomdp:
    n_paradigms: 2
    theta_vals: [0.0, 1.0]
    true_paradigm: 1
    x_grid: [0.1, 0.3, 0.5, 0.8, 1.0]
    n_o: 5
    q_reliability: 0.65
    world:
      schedule: ramp
      theta_star_pre: 0.0
      theta_star_post: 1.0
      schedule_t_shift: 0
      schedule_ramp_T: 200
  n_context: 2
  eps_crisis: 0.05
  eps_resolve: 0.30
  D_c_normal: 0.9
  alpha_tl: 1.0
  obs_x_index: 4
  n_agents: 15
  n_steps: 150
  use_theta_schedule: true
  graph_kind: watts_strogatz
  mean_degree: 4
  social_mask: 1.0

  # social and material channels (toggled in sweep)
  trust_learning: false
  trust_rho: 0.95
  trust_alpha0: 1.0
  trust_beta0: 1.0

  resource_coupling: false
  r_init: 1.0
  R_in: 0.1
  alpha_flow: 0.3
  delta_decay: 0.05
  c0: 0.1
  r_min: 0.1
  budget_fraction: 0.5

  # value-tilt / utility partition (set the anti-truth bloc)
  motivated: false
  lambda_tilt: 0.0
  utility_tilt_fraction: 0.30
  utility_pro: 0.0
  utility_anti: 1.0

  # structural: gamma toggled in sweep
  n_dependents: 3
  edge_precision: 0.8
  gamma_strength: 0.0

sweep:
  gamma_strength: [0.0, 2.0]
  trust_learning: [false, true]
  resource_coupling: [false, true]

seeds: [0, 1, 2]

outputs:
  dir: experiments/results/E11
