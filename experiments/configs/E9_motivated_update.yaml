experiment:
  name: E9_motivated_update
  description: >
    Principled multi-level context (C=5) WITH per-agent value-tilted update
    (Hyland & Albarracin 2025 Eq. 13 at multi-agent scale). 30% of agents
    have utility tilted toward the wrong paradigm; the rest are pro-truth.
    Phase diagram: (q_reliability, lambda_tilt) at fixed paradigm-inertia
    parameters. Directly addresses David's note that E7 lacks the motivated
    update — this version has it.

model_type: motivated

base:
  pomdp:
    n_paradigms: 2
    theta_vals: [0.0, 1.0]
    true_paradigm: 1
    x_grid: [0.1, 0.3, 0.5, 0.8, 1.0]
    n_o: 5
    q_reliability: 0.75
    world:
      schedule: step
      theta_star_pre: 0.0
      theta_star_post: 1.0
      schedule_t_shift: 100
  n_context: 5
  eps_crisis: 0.15
  eps_resolve: 0.20
  eps_theta: 0.02
  D_c_normal: 0.8
  alpha_tl: 1.0
  obs_x_index: 4
  n_agents: 40
  n_steps: 300
  use_theta_schedule: true
  graph_kind: watts_strogatz
  mean_degree: 4
  social_mask: 1.0
  trust_learning: false
  resource_coupling: false
  maverick_fraction: 0.20
  maverick_social_mask: 0.2
  motivated: true
  utility_tilt_fraction: 0.30
  utility_pro: 1.0
  utility_anti: 1.0

sweep:
  q_reliability: [0.55, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  lambda_tilt: [0.0, 0.5, 1.0, 2.0, 3.0]

seeds: [0, 1, 2, 3, 4]

outputs:
  dir: experiments/results/E9
