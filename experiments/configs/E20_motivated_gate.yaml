experiment:
  name: E20_motivated_gate
  description: E9 re-run with the cost-of-mind-change evidence-gate update mode (asymmetric
    resistance to disconfirming a valued paradigm) instead of the saturating state-tilt.
    Tests whether the social-coupling phase boundary survives motivated reasoning.
model_type: motivated
base:
  pomdp:
    n_paradigms: 2
    theta_vals:
    - 0.0
    - 1.0
    true_paradigm: 1
    x_grid:
    - 0.1
    - 0.3
    - 0.5
    - 0.8
    - 1.0
    n_o: 5
    q_reliability: 0.75
    world:
      schedule: step
      theta_star_pre: 0.0
      theta_star_post: 1.0
      schedule_t_shift: 100
  n_context: 5
  eps_crisis: 0.15
  eps_resolve: 0.2
  eps_theta: 0.02
  D_c_normal: 0.8
  alpha_tl: 1.0
  obs_x_index: 4
  n_agents: 40
  n_steps: 300
  use_theta_schedule: true
  graph_kind: watts_strogatz
  mean_degree: 4
  social_mask: 1.0
  trust_learning: false
  resource_coupling: false
  maverick_fraction: 0.2
  maverick_social_mask: 0.2
  motivated: true
  utility_tilt_fraction: 0.3
  utility_pro: 1.0
  utility_anti: 1.0
  update_mode: evidence_gate
sweep:
  q_reliability:
  - 0.55
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  lambda_tilt:
  - 0.0
  - 0.5
  - 1.0
  - 2.0
  - 3.0
seeds:
- 0
- 1
- 2
- 3
- 4
outputs:
  dir: experiments/results/E20
