name: Build precision-collapse paper

on:
  push:
    paths:
      - 'paper-precision-collapse/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper-precision-collapse
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -bibtex -interaction=nonstopmode -halt-on-error

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: precision-collapse-paper
          path: paper-precision-collapse/main.pdf
